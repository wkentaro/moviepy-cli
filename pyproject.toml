[build-system]
requires = ["hatchling>=1.20.0", "hatch-vcs", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[project]
name = "moviepy-cli"
description = "Command line tools for quick video editing."
license = "MIT"
authors = [{ name = "Kentaro Wada", email = "www.kentaro.wada@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["moviepy<2", "path<17"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dynamic = ["readme", "version"]

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"
fragments = [{ path = "README.md" }]

[tool.hatch.version]
source = "vcs"

[project.urls]
Homepage = "http://github.com/wkentaro/moviepy-cli"

[project.scripts]
moviepy = "moviepy_cli:main"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "ANN", # flake8-annotations
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[dependency-groups]
dev = [
  "ipython>=8.38.0",
  "mdformat>=1.0.0",
  "mdformat-gfm>=1.0.0",
  "ruff>=0.14.13",
  "taplo>=0.9.3",
  "ty>=0.0.12",
  "typos>=1.45.1",
  "yamlfix>=1.19.1",
]
